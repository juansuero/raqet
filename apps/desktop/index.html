<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raqet Desktop</title>
    <style>
      :root {
        color: #1a1f1c;
        background: #fafbf9;
        font-family: "DM Sans", "Segoe UI", Arial, sans-serif;
      }

      body {
        margin: 0;
        background: #fafbf9;
      }

      #boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .boot-card {
        width: min(420px, 100%);
        border: 1px solid #e3e8e4;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(16, 36, 25, 0.08);
        padding: 28px;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .boot-mark {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        overflow: hidden;
        background: #00703c;
        box-shadow: 0 10px 24px rgba(0, 112, 60, 0.18);
      }

      .boot-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .boot-card h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1;
        letter-spacing: 0;
      }

      .boot-card p {
        margin: 18px 0 0;
        color: #5e6b62;
        font-size: 15px;
        line-height: 1.6;
      }

      .boot-bar {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: #e6f4ed;
        margin-top: 22px;
      }

      .boot-bar span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #00703c;
        animation: boot-progress 1.4s ease-in-out infinite;
      }

      @keyframes boot-progress {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(250%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section id="boot-screen" aria-label="Loading Raqet Desktop">
        <div class="boot-card">
          <div class="boot-brand">
            <div class="boot-mark" aria-hidden="true">
              <img src="/raqet-logo-imagegen.png" alt="" />
            </div>
            <h1>Raqet</h1>
          </div>
          <p>Loading your local tennis video workspace.</p>
          <div class="boot-bar" aria-hidden="true"><span></span></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
